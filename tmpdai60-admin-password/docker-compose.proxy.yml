# Reverse-proxy layer that fronts the frontend (app) and backend (api) with a single
# wildcard-TLS entrypoint for portfolio subdomains.
#
#   docker compose -f docker-compose.proxy.yml --env-file .env.proxy up -d
#
# Required .env.proxy:
#   DNS_API_TOKEN   API token for your DNS provider (DNS-01 ACME challenge for *.dainn.online)
#
# The Caddy image must include your DNS-provider plugin. Build it once, e.g. for Cloudflare:
#   docker build -t dresume-caddy - <<'EOF'
#   FROM caddy:2-builder AS build
#   RUN xcaddy build --with github.com/caddy-dns/cloudflare
#   FROM caddy:2
#   COPY --from=build /usr/bin/caddy /usr/bin/caddy
#   EOF
#
# `app` and `api` must be reachable on this network — either run the frontend/backend compose
# projects attached to `dresume-proxy`, or merge their services into this file.

name: dresume-proxy

services:
  caddy:
    image: dresume-caddy        # built with the DNS plugin (see header)
    container_name: dresume-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DNS_API_TOKEN: ${DNS_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dresume-proxy

networks:
  dresume-proxy:
    name: dresume-proxy

volumes:
  caddy-data:
  caddy-config:
