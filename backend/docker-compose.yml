name: dresume-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: dresume-postgres
    environment:
      POSTGRES_DB: dresume
      POSTGRES_USER: dresume
      POSTGRES_PASSWORD: dresume
    ports:
      - "5432:5432"
    volumes:
      - dresume-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dresume -d dresume"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dresume-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./DResume.Api
      dockerfile: Dockerfile
    container_name: dresume-api
    ports:
      - "5267:5267"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      # DEV compose: emails captured by MailHog (NOT sent to real recipients)
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5267
      DainnUser__Database__ConnectionString: "Host=postgres;Port=5432;Database=dresume;Username=dresume;Password=dresume"
      Resume__ConnectionString: "Host=postgres;Port=5432;Database=dresume;Username=dresume;Password=dresume"
      DainnUser__Email__SmtpHost: "mailhog"
      DainnUser__Email__SmtpPort: "1025"
      DainnUser__Jwt__Secret: "${DAINNUSER_JWT_SECRET}"
      Encryption__Key: "${ENCRYPTION_KEY}"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:3005"
      # Uploaded resume files persisted to a named volume (survive redeploys)
      Storage__UploadsPath: /app/uploads
    volumes:
      - ./DResume.Api/appsettings.json:/app/appsettings.json:ro
      - dresume-dp-keys:/root/.aspnet/DataProtection-Keys
      - dresume-uploads:/app/uploads
    restart: unless-stopped

volumes:
  dresume-pg:
  dresume-dp-keys:
  dresume-uploads:
